user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===== mahiro.cloud 主站（个人主页，保持原样）=====
    server {
        listen 80;
        listen [::]:80;
        server_name mahiro.cloud www.mahiro.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name mahiro.cloud www.mahiro.cloud;

        ssl_certificate /etc/letsencrypt/live/mahiro.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mahiro.cloud/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /home/frontend/cyber_HY/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/([a-zA-Z0-9_-]+)$ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }
    }

    # ===== tinyurl.mahiro.cloud（新前端根路径 + 旧前端 /legacy/ + 双后端并存）=====
    server {
        listen 80;
        listen [::]:80;
        server_name tinyurl.mahiro.cloud www.tinyurl.mahiro.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tinyurl.mahiro.cloud www.tinyurl.mahiro.cloud;

        ssl_certificate /etc/letsencrypt/live/mahiro.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mahiro.cloud/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # —— 新前端静态文件根目录（new-tinyurl 分支构建产物）——
        root /home/frontend/tinyurl-new-dist;
        index index.html;

        # ---- 后端 API：用 ^~ 确保优先于旧短链正则匹配 ----

        # 新版短链服务（8080）：生成、健康检查、新版短链跳转
        location ^~ /shorten {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /s/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8080;
            access_log off;
        }

        # 指标端点仅限本机，且用 ^~ 防止被旧短链正则抢走
        location ^~ /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:8080;
            access_log off;
        }

        # 旧版 API（8081）：登录/注册/我的短链/统计
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 旧前端（main 分支，部署在 /legacy/ 下）----
        location ^~ /legacy/ {
            alias /home/frontend/tinyurl-old-dist/;
            index index.html;
            try_files $uri $uri/ /legacy/index.html;
        }

        # ---- Grafana 监控面板（^~ 优先，proxy_pass 末尾不带 /）----
        location ^~ /grafana/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---- 旧短链重定向（8081，保持旧短码可用）----
        # 注意：必须放在所有 ^~ 之后，否则会抢走 /shorten、/metrics 等路径
        location ~ ^/([a-zA-Z0-9_-]+)$ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }

        # ---- 新前端 SPA 回退 ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
