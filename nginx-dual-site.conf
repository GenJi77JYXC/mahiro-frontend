# ============================================================================
# tinyurl.mahiro.cloud — 新旧短链服务前端共存配置
#
# 路由规划：
#   /                → 新前端（new-tinyurl 分支）+ 新后端 :8080
#   /legacy/         → 旧前端（main 分支）+ 旧后端 :8081
#   /api/            → 旧后端 API（登录/注册/我的短链）
#   /shorten, /s/    → 新后端（无状态短链生成/跳转）
#   /{code}          → 旧短链跳转（兼容已生成的旧短链，必须保留）
#   /grafana/        → Grafana 监控面板
#
# 前置条件：
#   1. 新前端 dist 放到 /var/www/tinyurl-new/dist
#   2. 旧前端 dist 放到 /var/www/tinyurl-old/dist
#      （旧前端构建时需设置 Vite base=/legacy/ 和 router base=/legacy/）
#   3. SSL 证书路径按实际填写
# ============================================================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name tinyurl.mahiro.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tinyurl.mahiro.cloud;

    # —— SSL 证书（按实际路径修改）——
    ssl_certificate     /etc/nginx/ssl/tinyurl.mahiro.cloud.pem;
    ssl_certificate_key /etc/nginx/ssl/tinyurl.mahiro.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # —— 新前端静态文件根目录 ——
    root  /var/www/tinyurl-new/dist;
    index index.html;

    # ===================================================================
    # 后端 API（用 ^~ 确保优先于旧短链正则匹配）
    # ===================================================================

    # 新后端：短链生成
    location ^~ /shorten {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 新后端：短链跳转
    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 新后端：健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # 新后端：Prometheus 指标（仅允许本机/Prometheus 抓取）
    location = /metrics {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # 旧后端：用户系统 API（登录/注册/我的短链/统计）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===================================================================
    # Grafana 监控面板（必须放在旧短链正则之前，用 ^~ 优先匹配）
    # ===================================================================
    location ^~ /grafana/ {
        proxy_pass         http://127.0.0.1:3000;   # 注意：末尾不带 /
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ===================================================================
    # 旧前端（部署在 /legacy/ 路径下）
    # ===================================================================
    location ^~ /legacy/ {
        alias  /var/www/tinyurl-old/dist/;
        index  index.html;
        try_files $uri $uri/ /legacy/index.html;
    }

    # ===================================================================
    # 旧短链跳转：兼容已生成的旧短链（根路径短码，如 /abc123）
    # 此正则必须晚于上面所有 ^~ 前缀匹配，否则会抢走 API 路径
    # ===================================================================
    location ~ ^/([a-zA-Z0-9_-]+)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===================================================================
    # 新前端 SPA 回退（根路径及未匹配路径交给 Vue Router）
    # ===================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
